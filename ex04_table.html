<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- css-->
    <style>
        /* 선택자를 이용해서 요소를 선택 */
        /* 스타일 주석 
        태그명 { 스타일 작성 }
        ; - 여러개 넣을때 마감표시 , 문장의 끝
         */
        td{text-align : center; }

    </style>
</head>
<body>
    <!-- tr : 한 줄 , td :  한 칸, th : 한 칸의 제목-->
     <!-- th : 제목(가운데 정렬 + 두꺼운 글자)
      너비 : width
      높이 : height
      가운데 정렬 : align="center/right/left"
      rowspan - 행 합치기 (겹치는 셀은 지우기), colspan - 열 합치기 (겹치는 셀은 지우기)-->
     <!-- 3행 3열-->
      table>(tr>td{셀$}*3)*3
      table>(tr>td{셀$}*3)*3
<h1>상품구성</h1>
 <table border="1">
        <caption>선물용과 가정용 상품 구성</caption>
        <tr>
            <th width="100px">용도</th>
            <th width="70px">중량</th>
            <th width="100px">갯수</th>
            <th width="100px">가격</th>
        </tr>
        <tr>
            <td rowspan="2">선물용</td>
            <td>3kg</td>
            <td>11~16과</td>
            <td>35,000원</td>
        </tr>
        <tr>
            <td>5kg</td>
            <td>18~26과</td>
            <td>52,000월</td>
        </tr>
        <tr>
            <td rowspan="2">가정용</td>
            <td>3kg</td>
            <td>11~16과</td>
            <td>30,000원</td>
        </tr>
        <tr>
            <td>5kg</td>
            <td>18~26과</td>
            <td>47,000원</td>
        </tr>
      </table>

    <table border="1">
      (tr>td{셀$}*3)*3
      <caption>테이블 제목</caption>

      <tr>
        <th width="100px">셀1</th>
        <th width="100px">셀2</th>
        <th width="100px">셀3</th>
      </tr>
      <tr>
        <td>셀1</td>
        <td>셀2</td>
        <td>셀3</td>
      </tr>
      <tr>
        <td>셀1</td>
        <td>셀2</td>
        <td>셀3</td>
      </tr>


    </table>
</body>
</html>
