<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      *
        /* 테두리까지 포함해서 너비값으로 지정 */ {
        box-sizing: border-box;
      }
      h1 {
        font-size: 1rem;
        background-color: black;
        color: white;
        padding: 10px;
        margin: 0px;
      }
      h2 {
        color: red;
        text-align: center;
        font-size: 1.4rem;
      }

      div {
        border: 20px solid palevioletred; /*container 라는 부모요소 때문에 자식으로 
        되는거 같음, container 에서 border 태그 빼면 이 태그로 인식됨.*/
      }

      p {
        font-size: 1.2rem;
        font-weight: 700;

        line-height: 30px;
      }
      #container {
        width: 700px;
        font-family: "맑은 고딕", 고딕, 궁서;
        margin: 0 auto;
        box-shadow: 10px 10px 40px 10px rgb(123, 123, 156);
        padding: 10px 20px 30px 40px; /*오른쪽 방향으로 돈다*/

        border: 20px solid red; /*밑에 3개를 동시에 표현해줌, 다 써야 반영됨*/
        border-style: double;
        border-color: blue;
        border-width: 20px; /* 더 자세한거가 반영 되나봄*/
        border-radius: 100px;
      }

      .accent {
        color: blue;
      }

      .smalltext {
        font-size: small;
      }

      #container img {
        width: 100%;
        margin-top: 50px;
        border-top-left-radius: 100px;
        border-top-right-radius: 100px;
      }

      #bear {
        border-radius: 100%;
        box-shadow: 10px 5px 10px 5px yellow;
        border: 5px dashed wheat;
      }
      body {
        text-align: center;
      }

      #check{
        width: 700px;
        font-family: "맑은 고딕", 고딕, 궁서;
        margin: 50 auto;
        box-shadow: 10px 10px 40px 10px rgb(123, 123, 156);
        padding: 10px 20px 30px 40px; /*오른쪽 방향으로 돈다*/

        border: 20px solid red; /*밑에 3개를 동시에 표현해줌, 다 써야 반영됨*/
        border-radius: 100px;
      }
    </style>
  </head>
  <body>
    <img id="bear" src="/img/bear.png" alt="" />
    <div id="container">
      <img src="/img/tangerines.webp" alt="오렌지" />
      <div id="check">
        <h1>확인하세요</h1>
        <h2>주문 및 배송</h2>
        <p>
          <span class="accent">오후 2시 이전</span> 주문건은 당일 발송합니다<br />
          2시 이후 주문건은 다음날 발송합니다(주말 제외)
        </p>
        <hr />
        <h2>교환 및 환불</h2>
        <p>
          불만족시 <span class="accent">100% 환불</span>해 드립니다<br />
          고객센터로 전화주세요
        </p>
        <hr />
        <h2>고객센터</h2>
        <p>
          0000-0000<br />
          <span class="smalltext"
            >상담시간 : 오전 9시 ~ 오후 6시 (토/일, 공휴일 휴무)</span
          >
        </p>
      </div>
    </div>
  </body>
</html>
