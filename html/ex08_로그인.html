<body>
    <!-- action : 요청 URL  -->
     <form action="/html/ex01.html">
        ?name=momo&tel=123123123&email=momo@abc.com
        <!--  서버에 요청을 전송하는 버튼 -->
          <input type="submit" value="버튼">

          <input type="text" name="name" id="" value="momo">

          <fieldset>

                <ul>

                </ul>

                <ul>
                    <li><label><input type="radio" name="gift" id="" value="yes">선물 포장</label></li>
                    <li><label><input type="radio" name="gift" id="" value="no">선물 포장 안 함</li>
                </ul>
          </fieldset>

          <ul>
            <li><label for="">이름</label>
            <input type="text" name="" id=""></li>
            <li><label for="">배송주소</label>

            <input type="email" name="" id=""></li>

     </form>
