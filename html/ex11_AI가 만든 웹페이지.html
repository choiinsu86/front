<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 모바일 반응형 필수 메타 태그 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>레드향 주문하기 (반응형)</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 15px;
        font-family: "Malgun Gothic", sans-serif;
      }

      /* 최대 너비 600px로 제한하고 화면이 작아지면 100%로 유동적 조절 */
      #container {
        width: 100%;
        max-width: 600px;
        margin: 10px auto;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 15px;
      }

      .product-img {
        width: 100%;
        height: 230px;
        object-fit: cover;
        margin-bottom: 15px;
        display: block;
      }

      fieldset {
        border: 1px solid #ccc;
        padding: 20px 25px;
        margin: 0 0 20px 0;
      }

      legend {
        font-weight: bold;
        font-size: 16px;
        padding: 0 5px;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      li {
        margin-bottom: 14px;
        display: flex;
        align-items: center;
      }

      li:last-child {
        margin-bottom: 0;
      }

      label {
        width: 100px;
        flex-shrink: 0; /* 화면이 줄어들어도 라벨 너비 유지 */
        font-size: 14px;
      }

      input[type="text"],
      input[type="email"],
      input[type="tel"] {
        width: 100%;
        max-width: 340px;
        height: 30px;
        padding: 4px 8px;
        border: 1px solid #aaa;
        font-size: 14px;
      }

      .date-wrap {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }

      input[type="date"] {
        height: 30px;
        padding: 0 6px;
        border: 1px solid #aaa;
        font-size: 14px;
      }

      .notice {
        font-size: 13px;
        color: #555;
      }

      .buttons {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 20px;
      }

      .buttons input {
        width: 130px;
        height: 42px;
        background-color: #fafafa;
        border: 1px solid #ccc;
        font-size: 14px;
        cursor: pointer;
      }

      .buttons input:hover {
        background-color: #eee;
      }

      /* 모바일 환경 (화면 너비 600px 이하) 스타일 */
      @media screen and (max-width: 600px) {
        h1 {
          font-size: 24px;
        }

        .product-img {
          height: 180px;
        }

        fieldset {
          padding: 15px;
        }

        /* 라벨과 입력창을 세로로 배치 */
        li {
          flex-direction: column;
          align-items: flex-start;
        }

        label {
          width: 100%;
          margin-bottom: 6px;
          font-weight: bold;
        }

        /* 모바일에서는 입력창을 가로 100%로 꽉 채움 */
        input[type="text"],
        input[type="email"],
        input[type="tel"] {
          max-width: 100%;
          height: 38px; /* 터치하기 편하도록 높이 확대 */
        }

        input[type="date"] {
          height: 38px;
        }

        /* 하단 버튼 2개가 화면 너비에 맞춰 나란히 50%씩 차지 */
        .buttons input {
          width: 50%;
          height: 45px;
        }
      }
    </style>
  </head>
  <body>
    <div id="container">
      <h1>레드향 주문하기</h1>

      <img src="images/tangerines.jpg" alt="레드향" class="product-img" />

      <form action="#" method="post">
        <fieldset>
          <legend>배송 정보</legend>
          <ul>
            <li>
              <label for="prod">주문 상품</label>
              <input type="text" id="prod" value="상품용 3KG" readonly />
            </li>
            <li>
              <label for="user-name">이름</label>
              <input type="text" id="user-name" required />
            </li>
            <li>
              <label for="addr">배송 주소</label>
              <input type="text" id="addr" required />
            </li>
            <li>
              <label for="mail">이메일</label>
              <input type="email" id="mail" />
            </li>
            <li>
              <label for="phone">연락처</label>
              <input
                type="tel"
                id="phone"
                placeholder="하이픈 빼고 입력해 주세요.(01012345678)"
                required
              />
            </li>
            <li>
              <label for="d-day">배송 지정</label>
              <div class="date-wrap">
                <input type="date" id="d-day" />
                <span class="notice">(주문일로부터 최소 3일 이후)</span>
              </div>
            </li>
          </ul>
        </fieldset>

        <div class="buttons">
          <input type="submit" value="주문하기" />
          <input type="reset" value="취소하기" />
        </div>
      </form>
    </div>
  </body>
</html>
