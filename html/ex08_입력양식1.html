<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>입력 양식 만들기</h1>
    <!-- 서버에 데이터를 전달 하기 -->
    <!-- 1. form 태그 안에 입력 양식을 작성 -->
    <!-- 2. 입력태그의 name 에 서버에 전달할 이름을 작성 -->
    <!-- tab : 들여쓰기, shift + tab : 백탭 -->
    <!-- value : 화면에 출력되는 내용 - 서버에 넘어가는 값, name : 서버에 전달되는 이름 -->

    <form action="">  

        <label for="user id"><b>아이디 : </b></label><input type="text" 
        name="id" id="user id" value="abc">
        <label for="userPw"><b>비밀번호 : </b></label><input type="password" 
        name="pw" id="userPw" value="1234">
        <input type="submit" value="전 송">

    </form>

    <hr>

    <!-- placeholder : 입력 힌트 - value 속성의 값이 없을 때만 보여집니다. -->
    <input type="text" name="" id="" placeholder="아이디를 입력해주세요" value="asd">
    <input type="text" name="" id="" placeholder="000-0000-0000">

    <hr>
    <!-- 요소가 속해있는 form 을 기준으로 폼을 전송 하거나 초기화 할 수 있다. -->
    <form action="">
        
        <input type="text" name="" id="">
        <input type="submit" value="전송(요청)"> <!-- 서버에 요청(전송)-->
        <input type="reset" value="초기화"> <!-- 입력 요소의 값을 초기화-->
        <input type="button" value="일반버튼"> <!-- 그냥 버튼 ,(ex> 클릭, 더블클릭, 마우스 가져다 대기 등등..) 
        자바스크립트가 요소를 선택해서 이벤트를 추가 삭제-->
        
    </form>
    
    <hr>    
    <h3>체크박스와 라디오 버튼</h3>
    <input type="radio" name="" id="">라디오 버튼은 여러 항목 중 한개를 선택 할 수 있다 <br>
    <input type="checkbox" name="" id="">체크박스는 여러 항목 중 여러개를 선택 할 수 있다

    <!-- 체크된 값만 서버로 전달된다. -->
    <form action="">
        <fieldset>
            <legend>취미</legend>
            <!-- name 을 동일 하게 해야 같은 항목으로 본다.  -->
            <input type="checkbox" name="hobby" id="" value="1">축구
            <input type="checkbox" name="hobby" id="" value="2">야구
            <input type="checkbox" name="hobby" id="" value="3">농구
            <input type="checkbox" name="hobby" id="" value="4">배구
            <input type="checkbox" name="hobby" id="" value="5">수영

        </fieldset>
        <fieldset>
            <legend>성별</legend>
            <!-- name 이 다르면 다 체크 될 수 도 있다. -->
            <!-- name 은 서버에 정해진 거로 넣어야 한다. -->
            <input type="radio" name="gender" id="" value="m">남성
            <input type="radio" name="gender" id="" value="f">여성

        </fieldset>

        <input type="color" name="color" id=""><br>
        <input type="date" name="date" id="">  
        <input type="time" name="time" id="">  <br>
        <input type="datetime-local" name="datetime" id=""> <br>

        <!-- textarea : 여러 줄 을 입력 할 수 있다. -->
        <textarea name="textarea" id="" rows="5" cols="100"></textarea>
          

        <br><input type="submit" value="체크박스 라디오버튼 전송">



    </form>
    
</body>
</html>
